<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication Modülü</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
    .card { width: 100%; max-width: 400px; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tabs button { flex: 1; padding: 8px; border: 1px solid #334155; background: transparent; color: #94a3b8; border-radius: 6px; cursor: pointer; }
    .tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .auth-form, .auth-form-inner { display: flex; flex-direction: column; gap: 12px; }
    h2 { margin: 0 0 8px; font-size: 1.3rem; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; color: #cbd5e1; }
    input { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button[type="submit"], .card > button { padding: 10px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .links { display: flex; justify-content: space-between; margin-top: 6px; }
    .link-btn { background: none; border: none; color: #60a5fa; cursor: pointer; padding: 0; font-size: 0.85rem; }
    .alert { padding: 10px; border-radius: 6px; font-size: 0.9rem; }
    .alert.error { background: #7f1d1d; color: #fecaca; }
    .alert.success { background: #14532d; color: #bbf7d0; }
    .muted { color: #94a3b8; margin-top: 0; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="/src/components/Register.jsx"></script>
  <script type="text/babel" src="/src/components/Login.jsx"></script>
  <script type="text/babel" src="/src/components/ResetPassword.jsx"></script>
  <script type="text/babel" src="/src/App.jsx"></script>
</body>
</html>
